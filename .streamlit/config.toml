[theme]
base = "dark"
primaryColor = "#36d6a4"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#101a2b"
textColor = "#e5edf8"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 20
# No fixed address here: hosting services set their own. Local launchers pass
# --server.address 127.0.0.1 so a home run stays private to your computer.

[client]
toolbarMode = "minimal"
